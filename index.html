<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Cree Adoras — Panel</title>
<meta name="theme-color" content="#b98558"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Cree Adoras"/>
<script>if(/^https?:/.test(location.protocol)){var l=document.createElement("link");l.rel="manifest";l.href="manifest.json";document.head.appendChild(l)}</script>
<link rel="apple-touch-icon" href="logo192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg1:#f6f1eb;--bg2:#efe4d8;--ink:#2d241f;
  --brown:#c89b6d;--brown-d:#b98558;--brown-dd:#8a5a34;--sand:#d6b08a;
  --line:rgba(200,155,109,.24);--card:rgba(255,255,255,.82);
  --ok:#3f9d6b;--danger:#b25d4f;--danger-d:#944538;--blue:#4a8ec2;--purple:#8a6abf;
  --nav-h:68px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);min-height:100dvh;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h2,h3,.display{font-family:'Syne','Plus Jakarta Sans',sans-serif}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:48px;padding:12px 14px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.95);color:var(--ink);outline:none;margin-top:6px}
input:focus,select:focus,textarea:focus{border-color:var(--brown-d);box-shadow:0 0 0 3px rgba(200,155,109,.25)}
input:disabled{opacity:.6}
textarea{resize:vertical;min-height:84px}
label.f{display:block;font-size:13px;font-weight:700;color:rgba(45,36,31,.7);margin-top:14px}
:focus-visible{outline:3px solid rgba(185,133,88,.55);outline-offset:2px}

/* ---------- layout ---------- */
.shell{min-height:100dvh}
main{max-width:760px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 0 12px;
  background:linear-gradient(180deg,var(--bg1) 70%,rgba(246,241,235,0))}
.top img{width:42px;height:42px;border-radius:13px;object-fit:cover;background:#fff;flex:none}
.top h1{font-size:23px;font-weight:800;line-height:1.1;flex:1;min-width:0}
.top small{display:block;font-family:'Plus Jakarta Sans';font-size:12px;font-weight:600;opacity:.6;margin-top:2px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:linear-gradient(180deg,#c89b6d,#b98558);padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 24px rgba(0,0,0,.14)}
nav.tabs .tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:7px 2px;border-radius:16px;color:#fff;font-size:11px;font-weight:700;position:relative}
nav.tabs .tab .ic{font-size:21px;line-height:1}
nav.tabs .tab.on{background:linear-gradient(135deg,#fff,#f5ede4);color:var(--brown-dd);box-shadow:0 6px 16px rgba(0,0,0,.14)}
nav.tabs .more{display:none}
nav.tabs .side-user{display:none}
.badge{position:absolute;top:2px;right:calc(50% - 24px);min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  background:var(--danger-d);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px #c89b6d}

@media(min-width:900px){
  nav.tabs{top:0;bottom:auto;right:auto;width:250px;flex-direction:column;justify-content:flex-start;gap:6px;padding:24px 14px}
  nav.tabs .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:14px 16px;font-size:15px;border-radius:16px}
  nav.tabs .tab .ic{font-size:19px}
  nav.tabs .more{display:flex}
  nav.tabs .tab.masbtn{display:none}
  nav.tabs .brand{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:14px;padding:0 4px}
  nav.tabs .brand img{width:52px;height:52px;border-radius:16px;background:#fff;padding:3px;object-fit:cover}
  nav.tabs .brand b{font-size:21px;font-weight:800;display:block}
  nav.tabs .brand span{font-size:12px;opacity:.8}
  nav.tabs .side-user{display:block;margin-top:auto;color:#fff;font-size:13px;padding:8px 4px}
  nav.tabs .side-user b{display:block;font-size:15px}
  .badge{right:14px;top:50%;margin-top:-10px}
  main{margin-left:250px;max-width:none;padding:0 36px 40px}
  main>*{max-width:820px}
  .top img{display:none}
}
nav.tabs .brand{display:none}
@media(min-width:900px){nav.tabs .brand{display:flex}}

/* ---------- componentes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;
  box-shadow:0 8px 28px rgba(80,50,20,.07);backdrop-filter:blur(10px)}
.card+.card,.stack>*+*{margin-top:12px}
.sec{font-family:'Syne';font-size:18px;font-weight:800;margin:22px 2px 10px}
.muted{opacity:.65;font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.btn{min-height:48px;padding:12px 18px;border-radius:16px;font-weight:700;font-size:15px;display:inline-flex;
  align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.b-main{background:linear-gradient(135deg,#c89b6d,#b98558);color:#fff}
.b-sand{background:linear-gradient(135deg,#d6b08a,#c89b6d);color:#fff}
.b-ghost{background:rgba(255,255,255,.7);border:1px solid var(--line)}
.b-danger{background:linear-gradient(135deg,#b25d4f,#944538);color:#fff}
.b-ok{background:linear-gradient(135deg,#4cae7b,#3f9d6b);color:#fff}
.b-blue{background:linear-gradient(135deg,#6ea8d6,#4a8ec2);color:#fff}
.b-purple{background:linear-gradient(135deg,#a98bd6,#8a6abf);color:#fff}
.b-sm{min-height:38px;padding:8px 14px;font-size:13px;border-radius:12px}
.b-block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.ibtn{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.8);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;
  background:rgba(200,155,109,.18);color:var(--brown-dd);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fc{flex:none;padding:9px 15px;border-radius:99px;font-weight:700;font-size:14px;background:rgba(255,255,255,.7);border:1px solid var(--line)}
.fc.on{background:linear-gradient(135deg,#c89b6d,#b98558);color:#fff;border-color:transparent}
.empty{text-align:center;padding:34px 16px;opacity:.7;font-weight:600}
.empty b{display:block;font-size:34px;margin-bottom:6px}
.bar{height:8px;border-radius:99px;background:rgba(185,133,88,.18);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#c89b6d,#b98558);transition:width .3s}
.bar.full i{background:linear-gradient(90deg,#4cae7b,#3f9d6b)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-family:'Syne';font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;font-weight:600;opacity:.65}
.stat.warn b{color:var(--danger-d)}
.seg{display:flex;background:rgba(185,133,88,.14);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:12px;font-weight:700;font-size:14px}
.seg button.on{background:#fff;color:var(--brown-dd);box-shadow:0 3px 10px rgba(0,0,0,.1)}
.search{position:relative}
.search input{padding-left:42px;margin-top:0}
.search:before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;z-index:1}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;
  border-radius:20px;background:linear-gradient(135deg,#c89b6d,#b98558);color:#fff;font-size:30px;font-weight:600;
  box-shadow:0 10px 26px rgba(138,90,52,.4);display:flex;align-items:center;justify-content:center}
@media(min-width:900px){.fab{bottom:28px;right:36px}}

/* alerta de daños */
.alert{border-radius:22px;padding:16px;background:linear-gradient(135deg,#fdf0ec,#f8e1da);border:1.5px solid rgba(178,93,79,.45);
  box-shadow:0 10px 28px rgba(178,93,79,.18)}
.alert h3{font-size:17px;color:var(--danger-d);display:flex;gap:8px;align-items:center}
.alert .ai{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;margin-top:8px;border-radius:14px;background:rgba(255,255,255,.8)}
.alert .ai b{display:block;font-size:14px}
.alert .ai span{font-size:12px;opacity:.7}

/* calendario */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{flex:1;text-align:center;font-size:19px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;font-weight:800;opacity:.5;padding:4px 0}
.day{aspect-ratio:1/1.08;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-weight:700;font-size:15px;background:rgba(255,255,255,.65);min-width:0}
.day.out{opacity:.28}
.day.today{box-shadow:inset 0 0 0 2px var(--brown-d)}
.day.sel{background:linear-gradient(135deg,#c89b6d,#b98558);color:#fff}
.dots{display:flex;gap:3px;height:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%}
.day.sel .dot{box-shadow:0 0 0 1.5px #fff}
.dots small{font-size:9px;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;font-weight:600;opacity:.75}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}

/* línea de tiempo */
.tl-item{display:grid;grid-template-columns:50px 22px 1fr;gap:8px;width:100%;text-align:left}
.tl-date{text-align:center;padding-top:10px}
.tl-date b{display:block;font-family:'Syne';font-size:24px;font-weight:800;line-height:1}
.tl-date span{font-size:11px;font-weight:700;opacity:.6;text-transform:capitalize}
.tl-rail{position:relative}
.tl-rail:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(185,133,88,.3)}
.tl-item:first-child .tl-rail:before{top:20px}
.tl-item:last-child .tl-rail:before{bottom:calc(100% - 20px)}
.tl-node{position:absolute;left:50%;top:14px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--c);
  box-shadow:0 0 0 4px var(--bg2)}
.tl-card{margin:4px 0 10px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.tl-item.past .tl-card,.tl-item.past .tl-date{opacity:.55}
.tl-item.next .tl-card{border-color:var(--brown-d);box-shadow:0 8px 22px rgba(185,133,88,.25)}
.tl-card b{font-size:16px;display:block}
.tl-card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}

/* lista de eventos */
.ev{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px}
.ev .dt{flex:none;width:54px;text-align:center;border-radius:16px;padding:8px 0;background:rgba(200,155,109,.16)}
.ev .dt b{display:block;font-family:'Syne';font-size:22px;line-height:1}
.ev .dt span{font-size:11px;font-weight:800;color:var(--brown-dd);text-transform:uppercase}
.ev .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .info{flex:1;min-width:0}

/* checklist */
.chk{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:62px;padding:12px 14px;border-radius:18px;
  background:rgba(255,255,255,.78);border:1px solid var(--line);margin-bottom:10px;transition:background .2s}
.chk .box{flex:none;width:32px;height:32px;border-radius:10px;border:2.5px solid var(--brown);background:#fff;display:flex;
  align-items:center;justify-content:center;font-size:18px;color:#fff}
.chk.ready{background:rgba(34,197,94,.09);border-color:rgba(34,197,94,.35)}
.chk.ready .box{background:var(--ok);border-color:var(--ok)}
.chk .lb{flex:1;font-weight:700;font-size:16px;line-height:1.3}
.chk.ready .lb{opacity:.7}
.chkwrap{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.chkwrap .chk{margin-bottom:0}
.chkwrap .rep{flex:none;width:52px;border-radius:18px;background:#fdf0ec;border:1px solid rgba(178,93,79,.3);font-size:20px}

/* modales */
.ov[hidden]{display:none}
.ov{position:fixed;inset:0;background:rgba(45,36,31,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
#sheet{z-index:50}#modal{z-index:60}#dlg{z-index:70}
.sheet{width:100%;max-width:640px;max-height:94dvh;overflow:auto;overscroll-behavior:contain;
  background:linear-gradient(180deg,#fffdfb,#f5ede4);border-radius:28px 28px 0 0;padding:0 18px calc(24px + env(safe-area-inset-bottom));
  animation:up .22s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:rgba(45,36,31,.18);margin:8px auto 0}
.sheet .sh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 0;
  background:linear-gradient(180deg,#fffdfb 80%,rgba(255,253,251,0))}
.sheet .sh h2{flex:1;font-size:20px;font-weight:800;min-width:0}
.dlg{width:calc(100% - 40px);max-width:380px;margin:auto;background:#fffdfb;border-radius:24px;padding:22px;animation:up .18s}
.ov.c{align-items:center}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:28px;max-height:90dvh}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* líneas de presupuesto */
.line{padding:12px;border-radius:16px;background:rgba(255,255,255,.8);border:1px solid var(--line);margin-bottom:10px}
.line .l1{display:flex;gap:8px;align-items:center}
.line .l1 .ln{flex:1;font-weight:700;min-width:0}
.line .l1 input{margin:0}
.line .l2{display:flex;gap:10px;align-items:flex-end;margin-top:10px}
.line .l2>div{flex:1}
.line .l2 small{display:block;font-size:11px;font-weight:700;opacity:.6}
.line .l2 input{margin-top:3px;min-height:44px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;margin-top:3px}
.stepper button{width:44px;height:44px;font-size:22px;font-weight:700;color:var(--brown-dd)}
.stepper b{flex:1;text-align:center;font-size:17px}
.sub{font-weight:800;text-align:right;min-width:84px;padding-bottom:12px}
.totalbar{display:flex;justify-content:space-between;align-items:center;padding:16px;border-radius:20px;
  background:linear-gradient(135deg,#c89b6d,#b98558);color:#fff;margin-top:16px}
.totalbar b{font-family:'Syne';font-size:26px}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:16px;background:rgba(255,255,255,.8);border:1px solid var(--line);margin-bottom:8px}
.thumb{width:52px;height:52px;border-radius:14px;object-fit:cover;background:rgba(200,155,109,.18);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.tiptype{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tiptype button{padding:14px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:800}
.tiptype button.on{border-color:var(--danger);background:#fdf0ec;color:var(--danger-d)}
.photo{width:100%;max-height:260px;object-fit:cover;border-radius:18px;margin-top:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border:none}.kv b{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));z-index:100;
  background:#2d241f;color:#fff;padding:13px 20px;border-radius:16px;font-weight:600;font-size:14px;max-width:90vw;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);animation:up .2s}
.toast.err{background:var(--danger-d)}

/* login */
.auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth .card{width:100%;max-width:400px;padding:28px 24px;border-radius:30px}
.auth .logo{width:84px;height:84px;border-radius:26px;object-fit:cover;display:block;margin:0 auto 14px;background:#fff;
  box-shadow:0 10px 28px rgba(138,90,52,.25)}
.auth h1{text-align:center;font-size:28px;font-weight:800}
.auth p.sub2{text-align:center;opacity:.65;font-size:14px;margin:6px 0 10px}
.err{color:var(--danger-d);font-weight:700;font-size:14px;margin-top:12px;text-align:center}
.pw{position:relative}.pw button{position:absolute;right:6px;top:12px;width:42px;height:42px;font-size:18px}
.role{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;color:#fff}
.role.admin{background:var(--brown-dd)}.role.administrativo{background:var(--blue)}.role.colaborador{background:var(--ok)}
pre.sql{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#2d241f;color:#f5ede4;padding:12px;border-radius:14px;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="ov" hidden></div>
<div id="modal" class="ov" hidden></div>
<div id="dlg" class="ov c" hidden></div>
<div id="toastRoot"></div>

<script>
/* =====================================================
   CONFIG
===================================================== */
const SUPABASE_URL = "https://uarfndtspaejhddcnsxc.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhcmZuZHRzcGFlamhkZGNuc3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTQ4MzEsImV4cCI6MjA5NDE5MDgzMX0.25YME3yryDqttRwX4JwKpmFHMlyoHYmNn31xlX-2zWc";
const LOGO = SUPABASE_URL + "/storage/v1/object/public/imagenes/logo.jpg";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =====================================================
   HELPERS
===================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const q = v => esc(JSON.stringify(String(v)));              // argumento seguro para onclick
const money = n => "$" + Number(n || 0).toLocaleString("es-AR");
const pad = n => String(n).padStart(2, "0");
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoy = () => isoD(new Date());
const dstr = f => String(f || "").slice(0, 10);
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MES3 = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DOW = ["L","M","M","J","V","S","D"];
function parseD(f){ const [y,m,d] = dstr(f).split("-").map(Number); return y ? new Date(y, m-1, d) : null; }
function fmtLong(f){ const d = parseD(f); if(!d) return "Sin fecha"; const s = d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"}); return s.charAt(0).toUpperCase()+s.slice(1); }
function dowShort(f){ const d = parseD(f); return d ? d.toLocaleDateString("es-AR",{weekday:"short"}).replace(".","") : ""; }
function ago(ts){
  const s = (Date.now() - new Date(ts).getTime()) / 1000;
  if (s < 90) return "recién";
  if (s < 3600) return `hace ${Math.round(s/60)} min`;
  if (s < 86400) return `hace ${Math.round(s/3600)} h`;
  return `hace ${Math.round(s/86400)} d`;
}

/* =====================================================
   UI: toasts, hojas, modales, confirmación
===================================================== */
function toast(msg, err){
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  $("#toastRoot").appendChild(t); setTimeout(() => t.remove(), err ? 4200 : 2400);
}
function layer(id, html){
  const el = $("#" + id), was = !el.hidden, st = el.querySelector(".sheet")?.scrollTop || 0;
  el.innerHTML = html; el.hidden = false;
  const sh = el.querySelector(".sheet"); if (sh && was) { sh.style.animation = "none"; sh.scrollTop = st; }
  document.body.classList.add("lock");
  el.onclick = e => { if (e.target === el && id !== "dlg") closeLayer(id); };
}
function closeLayer(id){
  const el = $("#" + id); el.hidden = true; el.innerHTML = "";
  if ($("#sheet").hidden && $("#modal").hidden && $("#dlg").hidden) document.body.classList.remove("lock");
  if (id === "sheet") S.det = null;
}
const openSheet = h => layer("sheet", h), closeSheet = () => closeLayer("sheet");
const openModal = h => layer("modal", h), closeModal = () => closeLayer("modal");
const shell = (title, body, right = "") => `<div class="sheet"><div class="grab"></div>
  <div class="sh"><h2>${title}</h2>${right}<button class="ibtn" aria-label="Cerrar" onclick="A.cerrarTop()">✕</button></div>${body}</div>`;
function confirmar(msg, ok = "Confirmar", danger = false){
  return new Promise(res => {
    layer("dlg", `<div class="dlg"><p style="font-weight:700;font-size:16px;line-height:1.4">${esc(msg)}</p>
      <div class="row" style="margin-top:18px"><button class="btn b-ghost sp" id="dlgNo">Cancelar</button>
      <button class="btn ${danger ? "b-danger" : "b-main"} sp" id="dlgOk">${esc(ok)}</button></div></div>`);
    $("#dlgNo").onclick = () => { closeLayer("dlg"); res(false); };
    $("#dlgOk").onclick = () => { closeLayer("dlg"); res(true); };
  });
}
const empty = (ic, t) => `<div class="empty"><b>${ic}</b>${t}</div>`;
const busy = (btn, on, txt) => { if (!btn) return; btn.disabled = on; if (txt) btn.dataset.t = btn.dataset.t || btn.textContent, btn.textContent = on ? txt : btn.dataset.t; };

async function loadAll(){
  const r = await Promise.all([
    db.from("materiales").select("*").order("nombre"),
    db.from("presupuestos").select("*").order("fecha", { ascending: true }),
    db.from("colaboradores").select("*").order("nombre"),
    db.from("proveedores").select("*").order("nombre"),
    db.from("presupuestos_formales").select("*").order("id", { ascending: false }),
    db.from("reportes_danos").select("*").order("creado", { ascending: false })
  ]);
  if (r[0].data) S.d.mat = r[0].data;
  if (r[1].data) S.d.pre = r[1].data;
  if (r[2].data) S.d.col = r[2].data;
  if (r[3].data) S.d.prov = r[3].data;
  if (r[4].data) S.d.form = r[4].data;
  S.repOk = !r[5].error;
  if (r[5].data) S.d.rep = r[5].data;
  if (r.slice(0,5).some(x => x.error)) toast("No se pudieron cargar algunos datos: " + (r.slice(0,5).find(x => x.error).error.message || ""), true);
}
async function refrescar(){
  if (!S.user) return;
  const ae = document.activeElement;
  await loadAll();
  if (!(ae && ae.closest && ae.closest("#app") && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render();
  if (S.det && !$("#sheet").hidden && $("#modal").hidden) renderDetalle();
}
setInterval(() => { if (!document.hidden) refrescar(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refrescar(); });

async function rpc(fn, args){
  const { data, error } = await db.rpc(fn, args);
  if (error) throw new Error(error.message || "Error");
  return data;
}

};

/* =====================================================
   INICIO: alerta + calendario + línea de tiempo
===================================================== */
function prepInfo(p){
  const list = p.checklist && p.checklist.length ? p.checklist : (p.materiales || []);
  const tot = list.length;
  const ok = (p.checklist && p.checklist.length) ? p.checklist.filter(i => i.ready).length : 0;
  return { tot, ok, pct: tot ? Math.round(ok * 100 / tot) : 0 };
}
function vInicio(){
  const { y, m } = S.cal;
  const ev = eventosVisibles();
  const enMes = ev.filter(p => dstr(p.fecha).startsWith(`${y}-${pad(m+1)}`));
  const nombre = S.user.nombre.split(" ")[0];
  let body = "";

  if (isStaff() && S.repOk) {
    const sin = repSinAtender();
    if (sin.length) body += `<div class="alert" role="alert"><h3>⚠️ ${sin.length} ${sin.length === 1 ? "reporte sin atender" : "reportes sin atender"}</h3>
      <p class="muted" style="margin-top:2px">Pérdidas o daños informados desde los eventos.</p>
      ${sin.slice(0,3).map(r => `<button class="ai" onclick="A.verReporte(${q(r.id)})"><span style="font-size:22px">${r.tipo === "perdida" ? "🔍" : "🔧"}</span>
        <div class="sp"><b>${r.cantidad}× ${esc(r.material_nombre)}</b><span>${esc(r.cliente || "Evento")} · ${esc(r.reportado_por || "")} · ${ago(r.creado)}</span></div><span>›</span></button>`).join("")}
      <button class="btn b-danger b-block" style="margin-top:12px" onclick="A.ir('reportes')">Ver y resolver${sin.length > 3 ? ` (${sin.length})` : ""}</button></div>`;
  }
  if (!S.repOk && isAdmin()) body += `<div class="card" style="margin-top:12px"><b>Reportes de daños no disponibles.</b><p class="muted">Ejecutá supabase_setup.sql en Supabase para activarlos.</p></div>`;

  if (isStaff()) {
    const futuros = ev.filter(p => p.estado === "aceptado" && dstr(p.fecha) >= hoy() && prepInfo(p).pct < 100).length;
    const fact = enMes.filter(p => p.estado === "aceptado").reduce((a, p) => a + Number(p.total || 0), 0);
    body += `<div class="stats" style="margin-top:12px">
      <div class="stat"><b>${enMes.length}</b><span>Eventos en ${MESES[m].toLowerCase()}</span></div>
      <div class="stat"><b>${futuros}</b><span>Por terminar de preparar</span></div>
      <div class="stat ${repAbiertos().length ? "warn" : ""}"><b>${repAbiertos().length}</b><span>Reportes abiertos</span></div>
      <div class="stat"><b style="font-size:20px">${money(fact)}</b><span>Aceptados del mes</span></div></div>`;
  }
  body += `<div class="card" style="margin-top:12px">${calHtml(ev)}</div>`;

  const sel = S.cal.sel;
  const items = (sel ? ev.filter(p => dstr(p.fecha) === sel) : enMes).sort((a, b) => dstr(a.fecha).localeCompare(dstr(b.fecha)));
  body += `<div class="row" style="margin:22px 2px 10px"><h2 class="sec sp" style="margin:0">${sel ? fmtLong(sel) : "Línea de tiempo de " + MESES[m].toLowerCase()}</h2>
    ${sel ? `<button class="btn b-ghost b-sm" onclick="A.selDia(null)">Ver todo el mes</button>` : ""}</div>`;
  body += timeline(items, sel);
  return { title: `Hola, ${esc(nombre)}`, sub: `${ROLES[S.user.rol]}`, body, fab: isStaff() ? `<button class="fab" aria-label="Nuevo evento" onclick="A.nuevoEvento(${q(sel || "")})">+</button>` : "" };
}
function calHtml(ev){
  const { y, m, sel } = S.cal;
  const map = {};
  ev.forEach(p => { const k = dstr(p.fecha); if (k) (map[k] = map[k] || []).push(p); });
  const first = new Date(y, m, 1), start = (first.getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate();
  const prevDim = new Date(y, m, 0).getDate();
  let cells = "";
  const filas = Math.ceil((start + dim) / 7);
  for (let i = 0; i < filas * 7; i++) {
    let dnum, out = false, date;
    if (i < start) { dnum = prevDim - start + i + 1; out = true; date = isoD(new Date(y, m - 1, dnum)); }
    else if (i >= start + dim) { dnum = i - start - dim + 1; out = true; date = isoD(new Date(y, m + 1, dnum)); }
    else { dnum = i - start + 1; date = `${y}-${pad(m+1)}-${pad(dnum)}`; }
    const list = map[date] || [];
    const dots = list.slice(0, 3).map(p => `<span class="dot" style="background:${estInfo(p.estado)[1]}"></span>`).join("") + (list.length > 3 ? `<small>+${list.length - 3}</small>` : "");
    cells += `<button class="day ${out ? "out" : ""} ${date === hoy() ? "today" : ""} ${date === sel ? "sel" : ""}" onclick="A.selDia('${date}')" aria-label="${dnum}, ${list.length} eventos">${dnum}<span class="dots">${dots}</span></button>`;
  }
  const leg = isStaff() ? Object.entries(ESTADOS).map(([k, v]) => `<span style="--c:${v[1]}">${v[0]}</span>`).join("") : `<span style="--c:${ESTADOS.aceptado[1]}">Evento confirmado</span>`;
  return `<div class="calhead"><button class="ibtn" aria-label="Mes anterior" onclick="A.mes(-1)">‹</button>
    <h2>${MESES[m]} ${y}</h2><button class="ibtn" aria-label="Mes siguiente" onclick="A.mes(1)">›</button></div>
    <div class="cal">${DOW.map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div>
    <div class="row" style="margin-top:12px"><div class="legend sp" style="margin:0">${leg}</div><button class="btn b-ghost b-sm" onclick="A.hoyCal()">Hoy</button></div>`;
}
function timeline(items, sel){
  if (!items.length) return `<div class="card">${empty("🗓️", sel ? "No hay eventos este día" : "No hay eventos este mes")}</div>`;
  const nextId = items.find(p => dstr(p.fecha) >= hoy())?.id;
  return `<div>${items.map(p => {
    const [en, ec] = estInfo(p.estado), pr = prepInfo(p), d = parseD(p.fecha);
    const past = dstr(p.fecha) < hoy();
    return `<button class="tl-item ${past ? "past" : ""} ${sameId(p.id, nextId) ? "next" : ""}" style="--c:${ec}" onclick="A.abrir(${q(p.id)})">
      <div class="tl-date"><b>${d ? d.getDate() : "–"}</b><span>${dowShort(p.fecha)}</span></div>
      <div class="tl-rail"><span class="tl-node"></span></div>
      <div class="tl-card">${sameId(p.id, nextId) ? `<span class="chip" style="background:var(--brown-d);color:#fff;margin-bottom:6px">Próximo</span>` : ""}
        <b>${esc(p.cliente || "Sin nombre")}</b>
        <div class="meta">${p.salon ? `<span class="muted">📍 ${esc(p.salon)}</span>` : ""}
          ${isStaff() ? `<span class="chip" style="background:${ec}22;color:${ec}">${en}</span>` : ""}</div>
        ${pr.tot ? `<div class="bar ${pr.pct === 100 ? "full" : ""}" style="margin-top:10px"><i style="width:${pr.pct}%"></i></div>
          <div class="muted" style="margin-top:4px">${pr.ok} de ${pr.tot} materiales listos</div>` : ""}</div></button>`;
  }).join("")}</div>`;
}

/* =====================================================
   EVENTOS (presupuestos internos)
===================================================== */
function listaEventos(){
  const t = S.f.evQ.trim().toLowerCase();
  let L = eventosVisibles().filter(p => !t || (p.cliente || "").toLowerCase().includes(t) || (p.salon || "").toLowerCase().includes(t));
  if (S.f.evEstado) L = L.filter(p => p.estado === S.f.evEstado);
  const h = hoy();
  if (S.f.evTiempo === "prox") L = L.filter(p => !dstr(p.fecha) || dstr(p.fecha) >= h).sort((a, b) => (dstr(a.fecha) || "9").localeCompare(dstr(b.fecha) || "9"));
  else if (S.f.evTiempo === "pas") L = L.filter(p => dstr(p.fecha) && dstr(p.fecha) < h).sort((a, b) => dstr(b.fecha).localeCompare(dstr(a.fecha)));
  else L = L.sort((a, b) => dstr(b.fecha).localeCompare(dstr(a.fecha)));
  if (!L.length) return empty("📋", isStaff() ? "No hay eventos para mostrar" : "No hay eventos aceptados para mostrar");
  return L.map(p => eventoCard(p)).join("");
}
function eventoCard(p){
  const d = parseD(p.fecha), [en, ec] = estInfo(p.estado), pr = prepInfo(p);
  return `<button class="card ev" style="display:flex;margin-top:10px" onclick="A.abrir(${q(p.id)})">
    <div class="dt"><b>${d ? d.getDate() : "–"}</b><span>${d ? MES3[d.getMonth()] : ""}</span></div>
    <div class="info"><div class="nm">${esc(p.cliente || "Sin nombre")}</div>
      <div class="row" style="gap:6px;margin-top:5px;flex-wrap:wrap">
        ${isStaff() ? `<span class="chip" style="background:${ec}22;color:${ec}">${en}</span>` : ""}
        ${p.salon ? `<span class="muted">📍 ${esc(p.salon)}</span>` : ""}
        ${pr.tot ? `<span class="chip" style="${pr.pct === 100 ? "background:rgba(63,157,107,.16);color:var(--ok)" : ""}">${pr.pct === 100 ? "✔ Preparado" : pr.pct + "% listo"}</span>` : ""}</div></div>
    ${isAdmin() || S.user.rol === "administrativo" ? `<b style="font-size:14px">${money(p.total)}</b>` : ""}</button>`;
}
function vEventos(){
  const chip = (id, t) => `<button class="fc ${S.f.evTiempo === id ? "on" : ""}" onclick="A.f('evTiempo','${id}')">${t}</button>`;
  const body = `<div class="search"><input id="evq" placeholder="Buscar cliente o salón" value="${esc(S.f.evQ)}" oninput="A.busq('evQ',this.value,'listaEv',listaEventos)"/></div>

async function ajustarStock(mid, delta){
  if (mid === "" || mid == null) return;
  const { data, error } = await db.from("materiales").select("stock").eq("id", mid).single();
  if (error || !data) throw new Error("No se encontró el material en el inventario");
  const nuevo = Math.max(0, Number(data.stock || 0) + delta);
  const up = await db.from("materiales").update({ stock: nuevo }).eq("id", mid);
  if (up.error) throw new Error(up.error.message);
  const m = S.d.mat.find(x => sameId(x.id, mid)); if (m) m.stock = nuevo;
}
async function updRep(id, cambios){
  const { error } = await db.from("reportes_danos").update(cambios).eq("id", id);
  if (error) throw new Error(error.message);
  const r = S.d.rep.find(x => sameId(x.id, id)); if (r) Object.assign(r, cambios);
}
function comprimir(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error("No se pudo procesar la foto")); }, "image/jpeg", .72);
    };
    img.onerror = () => rej(new Error("No se pudo leer la foto")); img.src = url;
  });
}

  const L = S.d.col.filter(c => !t || (c.nombre || "").toLowerCase().includes(t) || (c.rol || "").toLowerCase().includes(t));
  if (!L.length) return empty("👥", "No hay colaboradores cargados");
  return L.map(c => `<div class="card" style="margin-top:10px"><div class="row"><div class="sp"><b style="font-size:17px">${esc(c.nombre)}</b>
    <div class="muted">${esc(c.rol || "Sin rol")}${c.dni ? " · DNI " + esc(c.dni) : ""}</div></div></div>
    <div class="row" style="margin-top:10px">${c.telefono ? `<a class="btn b-ghost b-sm sp" style="text-decoration:none" href="tel:${esc(c.telefono)}">📞 ${esc(c.telefono)}</a>` : `<span class="sp"></span>`}
    <button class="btn b-ghost b-sm" onclick="A.editCol(${q(c.id)})">✏️</button>
    <button class="btn b-ghost b-sm" style="color:var(--danger-d)" onclick="A.borrarCol(${q(c.id)})">🗑</button></div></div>`).join("");
}
function vColabs(){
  return { title: "Colaboradores", sub: "Equipo de trabajo",
    body: `<div class="search"><input placeholder="Buscar por nombre o rol" value="${esc(S.f.colQ)}" oninput="A.busq('colQ',this.value,'listaCol',listaColabs)"/></div><div id="listaCol">${listaColabs()}</div>`,
    fab: `<button class="fab" aria-label="Nuevo colaborador" onclick="A.editCol()">+</button>` };
}
function listaArchivados(){
  const t = S.f.arcQ.trim().toLowerCase();
  const L = S.d.pre.filter(p => p.archivado && (!t || (p.cliente || "").toLowerCase().includes(t))).sort((a, b) => dstr(b.fecha).localeCompare(dstr(a.fecha)));
  if (!L.length) return empty("📦", "No hay eventos archivados");
  return L.map(p => `<div class="card" style="margin-top:10px"><div class="row"><div class="sp"><b style="font-size:17px">${esc(p.cliente)}</b><div class="muted">${fmtLong(p.fecha)}</div></div><b>${money(p.total)}</b></div>
    <div class="row" style="margin-top:10px"><button class="btn b-ghost b-sm sp" onclick="A.pdf('interno',${q(p.id)})">📄 PDF</button>
    <button class="btn b-ghost b-sm sp" onclick="A.archivar(${q(p.id)},false)">↩︎ Restaurar</button>
    ${isAdmin() ? `<button class="btn b-ghost b-sm" style="color:var(--danger-d)" onclick="A.borrarEvento(${q(p.id)})">🗑</button>` : ""}</div></div>`).join("");
}
function vArchivados(){
  return { title: "Archivados", sub: "Eventos finalizados",
    body: `<div class="search"><input placeholder="Buscar cliente" value="${esc(S.f.arcQ)}" oninput="A.busq('arcQ',this.value,'listaArc',listaArchivados)"/></div><div id="listaArc">${listaArchivados()}</div>` };
}
function vUsuarios(){
  if (!S.usrLoaded) { A.cargarUsuarios(); }
  const L = S.d.usr;
  return { title: "Usuarios", sub: "Quién puede entrar y con qué permisos",

/* =====================================================
   EDITOR DE PRESUPUESTOS (interno y formal)
===================================================== */
let E = null; // { k:'interno'|'formal', d:{...} }
const primKey = () => E.k === "interno" ? "materiales" : "items";
const nameKey = () => E.k === "interno" ? "nombre" : "descripcion";
function calcTotal(d){
  const s = a => (a || []).reduce((t, x) => t + Number(x.cantidad || 0) * Number(x.precio || 0), 0);
  return s(d[E.k === "interno" ? "materiales" : "items"]) + s(d.colaboradores) + s(d.proveedores);
}
function lineHtml(list, i, l){
  const nk = list === "materiales" || list === "items" ? nameKey() : "nombre";
  const libre = E.k === "formal" && list === "items" || l.tipo === "especial";
  const stock = list === "materiales" && l.id ? S.d.mat.find(m => sameId(m.id, l.id)) : null;
  return `<div class="line"><div class="l1">${libre ? `<input placeholder="Descripción" value="${esc(l[nk] || "")}" oninput="A.ln('${list}',${i},'${nk}',this.value)"/>` : `<span class="ln">${esc(l[nk] || "")}${l.rol ? ` <span class="muted">· ${esc(l.rol)}</span>` : ""}</span>`}
      <button class="ibtn" aria-label="Quitar" onclick="A.lnDel('${list}',${i})">🗑</button></div>
    <div class="l2"><div><small>Cantidad</small><div class="stepper"><button onclick="A.lnQty('${list}',${i},-1)">−</button><b>${l.cantidad || 1}</b><button onclick="A.lnQty('${list}',${i},1)">+</button></div></div>
      <div><small>Precio c/u</small><input inputmode="decimal" type="number" min="0" value="${Number(l.precio || 0)}" oninput="A.ln('${list}',${i},'precio',this.value)"/></div>
      <div class="sub" id="sub-${list}-${i}">${money((l.cantidad || 1) * (l.precio || 0))}</div></div>
    ${stock && Number(l.cantidad) > Number(stock.stock) ? `<div class="muted" style="color:var(--danger-d);margin-top:6px">⚠️ Stock disponible: ${stock.stock}</div>` : ""}</div>`;
}
function bloqueLista(list, titulo, addTxt, pickKind){
  const arr = E.d[list] || [];
  return `<h3 class="sec" style="font-size:16px;margin-top:20px">${titulo}</h3>${arr.map((l, i) => lineHtml(list, i, l)).join("") || `<p class="muted" style="margin-bottom:8px">Todavía no agregaste nada.</p>`}
    <div class="row" style="flex-wrap:wrap"><button class="btn b-ghost b-sm sp" onclick="A.pick('${pickKind}')">＋ ${addTxt}</button>
    ${list === "materiales" || list === "items" ? `<button class="btn b-ghost b-sm sp" onclick="A.lnLibre()">＋ Ítem libre</button>` : ""}</div>`;
}
function listasEditor(){
  const p = primKey();
  return bloqueLista(p, E.k === "interno" ? "Materiales y equipamiento" : "Ítems", E.k === "interno" ? "Buscar material" : "Desde inventario", "materiales")
    + bloqueLista("colaboradores", "Personal", "Agregar persona", "colaboradores")
    + bloqueLista("proveedores", "Empresas y servicios", "Agregar empresa", "proveedores")
    + `<div class="totalbar"><span>Total</span><b id="e-total">${money(calcTotal(E.d))}</b></div>`;
}
function abrirEditor(){
  const d = E.d, interno = E.k === "interno";
  openModal(shell(d.id ? "Editar " + (interno ? "evento" : "presupuesto") : "Nuevo " + (interno ? "evento" : "presupuesto"), `
    <label class="f" for="e-cli">Cliente</label><input id="e-cli" value="${esc(d.cliente || "")}" oninput="E.d.cliente=this.value" placeholder="Nombre del cliente"/>
    <label class="f" for="e-fec">Fecha del evento</label><input id="e-fec" type="date" value="${esc(dstr(d.fecha))}" oninput="E.d.fecha=this.value"/>
    ${interno ? `<label class="f" for="e-sal">Salón o lugar</label><input id="e-sal" value="${esc(d.salon || "")}" oninput="E.d.salon=this.value"/>
      <label class="f" for="e-est">Estado</label><select id="e-est" onchange="E.d.estado=this.value">
        ${Object.entries(ESTADOS).map(([k, v]) => `<option value="${k}" ${d.estado === k ? "selected" : ""}>${v[0]}</option>`).join("")}</select>
      <p class="muted" style="margin-top:6px">Los colaboradores solo ven los eventos en estado <b>Aceptado</b>.</p>` : ""}
    <div id="e-listas">${listasEditor()}</div>
    ${!interno ? `<label class="f" for="e-not">Notas</label><textarea id="e-not" oninput="E.d.notas=this.value">${esc(d.notas || "")}</textarea>` : ""}
    <button class="btn b-main b-block" style="margin-top:20px" id="e-save" onclick="A.guardarEditor()">Guardar</button>`));
}

/* ---- sesión ---- */
A.login = async e => {
  e.preventDefault(); const btn = $("#l-btn"), err = $("#l-err"); err.textContent = "";
  const dni = $("#l-dni").value.replace(/\D/g, ""), pass = $("#l-pass").value;
  busy(btn, true, "Ingresando…");
  try {
    const u = await rpc("ca_login", { p_dni: dni, p_pass: pass });
    if (!u) { err.textContent = "DNI o contraseña incorrectos."; busy(btn, false); return; }
    await iniciarSesion(u);
  } catch (x) { err.textContent = errMsg(x); busy(btn, false); }
};
A.setup = async e => {
  e.preventDefault(); const btn = $("#l-btn"), err = $("#l-err"); err.textContent = "";
  const dni = $("#s-dni").value.replace(/\D/g, ""), nom = $("#s-nom").value.trim(), p1 = $("#s-p1").value, p2 = $("#s-p2").value;
  if (dni.length < 6) { err.textContent = "Revisá el DNI."; return; }
  if (p1 !== p2) { err.textContent = "Las contraseñas no coinciden."; return; }
  busy(btn, true, "Creando…");
  try { await iniciarSesion(await rpc("ca_crear_primer_admin", { p_dni: dni, p_nombre: nom, p_pass: p1 })); }
  catch (x) { err.textContent = errMsg(x); busy(btn, false); }
};
async function iniciarSesion(u){
  S.user = u; S.token = u.token; localStorage.setItem("ca_token", u.token);
  S.view = "inicio"; S.usrLoaded = false;
  await loadAll(); render();
}
A.logout = async () => {
  if (!await confirmar("¿Cerrar sesión?", "Cerrar sesión")) return;
  localStorage.removeItem("ca_token"); S.user = null; S.token = null; S.hay = true;
  closeLayer("sheet"); closeLayer("modal"); render();
};
A.mas = () => {

    <div class="card" style="margin-top:14px"><b>${esc(S.user.nombre)}</b><div class="muted">DNI ${esc(S.user.dni)}</div><span class="role ${S.user.rol}" style="margin-top:8px">${ROLES[S.user.rol]}</span>

      <button class="btn b-ghost sp" onclick="A.logout()">Salir</button></div></div>`));
};
A.cuenta = () => openModal(shell("Mi cuenta", `<div class="card"><b>${esc(S.user.nombre)}</b><div class="muted">DNI ${esc(S.user.dni)}</div><span class="role ${S.user.rol}" style="margin-top:8px">${ROLES[S.user.rol]}</span></div>

  try { await rpc("ca_cambiar_pass", { p_token: S.token, p_actual: $("#c-a").value, p_nueva: $("#c-n").value }); closeModal(); toast("Contraseña actualizada"); }

/* ---- eventos ---- */
A.abrir = id => { S.det = { id, tab: isStaff() ? "salida" : "salida" }; renderDetalle(); };
A.tab = t => { S.det.tab = t; renderDetalle(); };
A.tog = async (pid, cid, field) => {
  const p = findPre(pid); if (!p) return;
  const loc = checkList(p).map(x => ({ ...x })), it = loc.find(x => x.id === cid); if (!it) return;
  const val = !it[field]; it[field] = val;
  const prev = { checklist: p.checklist, etapa: p.etapa };
  p.checklist = loc; p.etapa = etapaDe(loc, p.etapa); renderDetalle();
  try {
    const { data: f, error: e1 } = await db.from("presupuestos").select("checklist").eq("id", p.id).single();
    if (e1) throw e1;
    let list = f.checklist && f.checklist.length ? f.checklist : loc;
    const fi = list.find(x => x.id === cid); if (fi) fi[field] = val;
    const etapa = etapaDe(list, p.etapa);
    const { error } = await db.from("presupuestos").update({ checklist: list, etapa }).eq("id", p.id);
    if (error) throw error;
    p.checklist = list; p.etapa = etapa; renderDetalle(); render();
  } catch (x) { Object.assign(p, prev); renderDetalle(); toast("No se pudo guardar. Revisá la conexión.", true); }
};
function etapaDe(list, actual){
  if (!list.length) return actual;
  if (list.every(x => x.ready)) return list.every(x => x.regreso_ok) ? "devuelto_correcto" : "preparado";
  return "pendiente_preparacion";
}
A.estado = async (id, estado) => {
  const { error } = await db.from("presupuestos").update({ estado }).eq("id", id);
  if (error) return toast("No se pudo cambiar el estado", true);
  findPre(id).estado = estado; render(); renderDetalle(); toast("Estado: " + estInfo(estado)[0]);
};
A.archivar = async (id, v) => {
  const { error } = await db.from("presupuestos").update({ archivado: v }).eq("id", id);
  if (error) return toast("No se pudo archivar", true);
  findPre(id).archivado = v; closeSheet(); render(); toast(v ? "Evento archivado" : "Evento restaurado");
};
A.borrarEvento = async id => {
  if (!await confirmar("¿Eliminar este evento definitivamente?", "Eliminar", true)) return;
  const { error } = await db.from("presupuestos").delete().eq("id", id);
  if (error) return toast("No se pudo eliminar", true);
  S.d.pre = S.d.pre.filter(p => !sameId(p.id, id)); closeSheet(); render(); toast("Evento eliminado");
};
const proxNum = () => S.d.pre.reduce((m, p) => Math.max(m, Number(p.numero || 0)), 0) + 1;
A.nuevoEvento = fecha => {
  E = { k: "interno", d: { cliente: "", fecha: fecha || "", salon: "", numero: proxNum(), materiales: [], checklist: [], colaboradores: [], proveedores: [], total: 0, estado: "aceptado", etapa: "pendiente_preparacion", archivado: false } };
  abrirEditor();
};
A.editarEvento = id => {
  const p = findPre(id);
  E = { k: "interno", d: { ...JSON.parse(JSON.stringify(p)), materiales: p.materiales || [], colaboradores: p.colaboradores || [], proveedores: p.proveedores || [], checklist: p.checklist || [] } };
  abrirEditor();
};
A.nuevoFormal = () => { E = { k: "formal", d: { cliente: "", fecha: "", items: [], colaboradores: [], proveedores: [], total: 0, notas: "" } }; abrirEditor(); };
A.editFormal = id => { const f = S.d.form.find(x => sameId(x.id, id)); E = { k: "formal", d: JSON.parse(JSON.stringify({ ...f, items: f.items || [], colaboradores: f.colaboradores || [], proveedores: f.proveedores || [] })) }; abrirEditor(); };
A.importar = () => {
  const L = S.d.pre.sort((a, b) => dstr(b.fecha).localeCompare(dstr(a.fecha))).slice(0, 60);
  openModal(shell("Importar evento", L.length ? L.map(p => `<button class="pick" onclick="A.importarDe(${q(p.id)})"><div class="sp"><b>${esc(p.cliente)}</b><div class="muted">${fmtLong(p.fecha)}</div></div><b>${money(p.total)}</b></button>`).join("") : empty("📋", "No hay eventos")));
};
A.importarDe = id => {
  const p = findPre(id);
  E = { k: "formal", d: { cliente: p.cliente || "", fecha: p.fecha || "", notas: "",
    items: (p.materiales || []).map(m => ({ descripcion: m.nombre || m.descripcion || "", cantidad: Number(m.cantidad || 1), precio: Number(m.precio || 0) })),
    colaboradores: (p.colaboradores || []).map(c => ({ ...c })), proveedores: (p.proveedores || []).map(c => ({ ...c })), total: 0 } };
  E.d.total = calcTotal(E.d); closeModal(); abrirEditor();
};
const refLista = () => { const el = $("#e-listas"); if (el) el.innerHTML = listasEditor(); };
const refTotal = () => { const t = $("#e-total"); if (t) t.textContent = money(calcTotal(E.d)); };
A.ln = (list, i, k, v) => {
  const l = E.d[list][i]; l[k] = k === "precio" ? Number(v || 0) : v;
  const s = $(`#sub-${list}-${i}`); if (s) s.textContent = money((l.cantidad || 1) * (l.precio || 0)); refTotal();
};
A.lnQty = (list, i, n) => { const l = E.d[list][i]; l.cantidad = Math.max(1, Number(l.cantidad || 1) + n); refLista(); };
A.lnDel = (list, i) => { E.d[list].splice(i, 1); refLista(); };
A.lnLibre = () => { const p = primKey(); E.d[p].push(E.k === "interno" ? { tipo: "especial", nombre: "", cantidad: 1, precio: 0 } : { descripcion: "", cantidad: 1, precio: 0 }); refLista(); };
A.pick = kind => {
  const src = kind === "materiales" ? S.d.mat : kind === "colaboradores" ? S.d.col : S.d.prov;
  window._pickKind = kind;
  openLayerPick(src, "");
};
function openLayerPick(src, t){
  const kind = window._pickKind;
  const L = src.filter(x => !t || (x.nombre || "").toLowerCase().includes(t)).slice(0, 50);
  const html = L.map(x => `<button class="pick" onclick="A.pickAdd(${q(x.id)})">
      ${kind === "materiales" ? (x.imagen ? `<img class="thumb" src="${esc(x.imagen)}" alt="" loading="lazy"/>` : `<span class="thumb">🧰</span>`) : `<span class="thumb">${kind === "colaboradores" ? "👤" : "🏢"}</span>`}
      <div class="sp"><b>${esc(x.nombre)}</b><div class="muted">${kind === "materiales" ? "Stock " + Number(x.stock || 0) : esc(x.rol || x.servicio || "")}</div></div>
      ${kind !== "colaboradores" ? `<b>${money(x.precio)}</b>` : ""}</button>`).join("") || empty("🔍", "Sin resultados");
  if (!$("#pickList")) {
    layer("dlg", `<div class="sheet" style="max-width:520px;align-self:flex-end"><div class="grab"></div><div class="sh"><h2>Elegir</h2><button class="ibtn" onclick="closeLayer('dlg')">✕</button></div>
      <div class="search"><input id="pickQ" placeholder="Buscar" oninput="A.pickQ(this.value)"/></div><div id="pickList" style="margin-top:12px">${html}</div></div>`);
    $("#dlg").classList.remove("c");
  } else $("#pickList").innerHTML = html;
}
A.pickQ = v => { const k = window._pickKind; openLayerPick(k === "materiales" ? S.d.mat : k === "colaboradores" ? S.d.col : S.d.prov, v.trim().toLowerCase()); };
A.pickAdd = id => {
  const k = window._pickKind;
  if (k === "materiales") {
    const m = S.d.mat.find(x => sameId(x.id, id)), arr = E.d[primKey()];
    const ex = E.k === "interno" ? arr.find(x => sameId(x.id, id)) : null;
    if (ex) ex.cantidad = Number(ex.cantidad || 1) + 1;
    else arr.push(E.k === "interno" ? { tipo: "material", id: m.id, nombre: m.nombre, imagen: m.imagen || "", cantidad: 1, precio: Number(m.precio || 0), costo: Number(m.costo || 0) } : { descripcion: m.nombre, cantidad: 1, precio: Number(m.precio || 0) });
  } else if (k === "colaboradores") {
    const c = S.d.col.find(x => sameId(x.id, id)); E.d.colaboradores.push({ id: c.id, nombre: c.nombre, rol: c.rol || "", telefono: c.telefono || "", cantidad: 1, precio: 0 });
  } else {
    const c = S.d.prov.find(x => sameId(x.id, id)); E.d.proveedores.push({ id: c.id, nombre: c.nombre, servicio: c.servicio || "", telefono: c.telefono || "", cantidad: 1, precio: Number(c.precio || 0) });
  }
  closeLayer("dlg"); $("#dlg").classList.add("c"); refLista(); toast("Agregado");
};
A.guardarEditor = async () => {
  const d = E.d, btn = $("#e-save");
  if (!String(d.cliente || "").trim()) return toast("Ingresá el nombre del cliente", true);
  if (!d.fecha) return toast("Elegí la fecha del evento", true);
  busy(btn, true, "Guardando…");
  try {
    let payload, tabla;
    if (E.k === "interno") {
      tabla = "presupuestos";
      const prev = d.checklist || [];
      const check = (d.materiales || []).map(it => {
        const label = `${it.cantidad}x ${it.nombre}`;

/* guarda una fila y se autocorrige ante diferencias con el esquema de la tabla */
async function guardarFila(tabla, id, payload){
  const p = { ...payload }, quitadas = [];
  const run = x => id ? db.from(tabla).update(x).eq("id", id) : db.from(tabla).insert(x);
  const fuente = { colaboradores: S.d.col, proveedores: S.d.prov, materiales: S.d.mat }[tabla] || [];
  for (let n = 0; n < 10; n++) {
    const r = await run(p);
    if (!r.error) { if (quitadas.length) toast("Guardado. Tu tabla no tiene la columna: " + quitadas.join(", ")); return; }
    const m = r.error.message || ""; let mm;
    if ((mm = m.match(/Could not find the '([^']+)' column/))) { delete p[mm[1]]; quitadas.push(mm[1]); continue; }
    if (r.error.code === "22P02" || /invalid input syntax/i.test(m)) {
      let ch = false; for (const k in p) if (p[k] === "") { p[k] = null; ch = true; }
      if (ch) continue;
    }
    if (!id && /null value in column "id"/i.test(m)) {
      const nums = fuente.map(x => Number(x.id)).filter(Number.isFinite);
      if (nums.length === fuente.length) { p.id = (nums.length ? Math.max(...nums) : 0) + 1; continue; }
    }
    if ((mm = m.match(/null value in column "([^"]+)"/i)) && p[mm[1]] === null) { p[mm[1]] = ""; continue; }
    throw new Error(m + (r.error.details ? " · " + r.error.details : ""));
  }
  throw new Error("No se pudo guardar");
}

async function b64(url){
  const r = await fetch(url), b = await r.blob();
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
}
